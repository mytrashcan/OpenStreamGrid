version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /
      - /sdk
      - /examples/react-integration
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      # Major action upgrades arrive as individual pull requests for review.
      github-actions:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /tracker
      - /origin
      - /peer
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # The build stage must match the distroless nodejs22 runtime, or native
      # modules (better-sqlite3, @roamhq/wrtc) fail to load with an ABI error.
      # Move both stages to a new Node LTS together, by hand.
      - dependency-name: node
        update-types:
          - version-update:semver-major
