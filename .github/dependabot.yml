version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /
      - /sdk
      - /examples/react-integration
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /tracker
      - /origin
      - /peer
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
