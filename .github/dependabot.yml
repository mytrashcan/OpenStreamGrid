version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /
      - /sdk
      - /examples/react-integration
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # These majors need coordinated changes; upgrade them deliberately.
      # typescript 7: @typescript-eslint 8 declares a peer range below 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # better-sqlite3 13: no Node 22 prebuilds, and the slim build images have
      # no compiler toolchain for node-gyp.
      - dependency-name: better-sqlite3
        update-types:
          - version-update:semver-major
      # @types/node: keep in step with the Node versions CI and images run.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      # Major action upgrades arrive as individual pull requests for review.
      github-actions:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /tracker
      - /origin
      - /peer
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # The build stage must match the distroless nodejs22 runtime, or native
      # modules (better-sqlite3, @roamhq/wrtc) fail to load with an ABI error.
      # Move both stages to a new Node LTS together, by hand.
      - dependency-name: node
        update-types:
          - version-update:semver-major
