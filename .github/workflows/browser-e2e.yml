name: Browser E2E

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "sdk/**"
      - "common/**"
      - "tracker/**"
      - "origin/**"
      - "e2e/browser/**"
      - "docker-compose.yml"
      - ".github/workflows/browser-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2p-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { player: hlsjs, segment-type: mpegts }
          - { player: hlsjs, segment-type: fmp4 }
          - { player: shaka, segment-type: fmp4 }
          - { player: videojs, segment-type: mpegts }
          # LL-HLS: the origin lists parts; viewer A assembles and shares them.
          - { player: hlsjs, segment-type: mpegts, parts: 3 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdk/package-lock.json
            e2e/browser/package-lock.json

      - name: Build the browser SDK
        run: |
          npm ci
          npm ci --prefix sdk
          npm run build --workspace @openstreamgrid/common
          npm run build --prefix sdk

      - name: Start tracker and origin
        env:
          HLS_SEGMENT_TYPE: ${{ matrix.segment-type }}
          HLS_PARTS_PER_SEGMENT: ${{ matrix.parts || 0 }}
        run: docker compose -p osg-e2e up --detach --build --wait tracker origin

      - name: Install Playwright and Chromium
        working-directory: e2e/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Bundle Video.js 10
        if: matrix.player == 'videojs'
        working-directory: e2e/browser
        run: npm run build:videojs

      - name: Run browser E2E
        working-directory: e2e/browser
        env:
          E2E_PLAYER: ${{ matrix.player }}
          E2E_LL_PARTS: ${{ matrix.parts || 0 }}
          EXPECTED_SEGMENT_TYPE: ${{ matrix.segment-type }}
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.player }}-${{ matrix.segment-type }}
          path: |
            e2e/browser/playwright-report
            e2e/browser/test-results
          retention-days: 7

      - name: Dump service logs on failure
        if: failure()
        run: docker compose -p osg-e2e logs --no-color --tail 200 tracker origin

      - name: Stop services
        if: always()
        run: docker compose -p osg-e2e down --volumes
