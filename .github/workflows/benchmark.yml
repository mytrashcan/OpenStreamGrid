name: Benchmark

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Benchmark scenario file'
        required: true
        default: 'benchmarks/scenarios/ci-smoke.json'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: benchmark-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run benchmark
        env:
          BENCHMARK_SCENARIO: ${{ github.event.inputs.scenario }}
        run: |
          set -o pipefail
          bash scripts/benchmark.sh \
            --scenario "$BENCHMARK_SCENARIO" \
            --output benchmark-results.json \
            2>&1 | tee /tmp/openstreamgrid-benchmark.log

      - name: Upload raw result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: benchmark-results.json

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-logs
          path: /tmp/openstreamgrid-benchmark*.log
