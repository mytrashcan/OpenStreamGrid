name: Benchmark

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Benchmark scenario file'
        required: true
        default: 'benchmarks/scenarios/ci-smoke.json'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: benchmark-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run benchmark
        env:
          BENCHMARK_SCENARIO: ${{ github.event.inputs.scenario }}
        run: |
          set -o pipefail
          bash scripts/benchmark.sh \
            --scenario "$BENCHMARK_SCENARIO" \
            --output benchmark-results.json \
            2>&1 | tee /tmp/openstreamgrid-benchmark.log

      - name: Upload raw result
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-logs
          path: /tmp/openstreamgrid-benchmark*.log
