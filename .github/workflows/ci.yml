name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install browser SDK dependencies
        working-directory: sdk
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Summarize coverage
        if: matrix.node-version == '22'
        run: |
          {
            echo '### Test coverage'
            echo '```'
            npx c8 report --reporter=text-summary
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: matrix.node-version == '22'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

      - name: Lint
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit SDK dependencies
        working-directory: sdk
        run: npm audit --audit-level=high

      - name: Verify SDK package contents
        working-directory: sdk
        run: npm pack --dry-run

  container-and-chart:
    strategy:
      fail-fast: false
      matrix:
        # Release images ship for both architectures; build each natively.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build runtime images
        run: |
          docker build -f tracker/Dockerfile -t openstreamgrid-tracker:test .
          docker build -f origin/Dockerfile -t openstreamgrid-origin:test .
          docker build -f peer/Dockerfile -t openstreamgrid-peer:test .
      - name: Load native modules inside the images
        run: |
          docker run --rm openstreamgrid-tracker:test -e "new (require('better-sqlite3'))(':memory:').close(); console.log('better-sqlite3', process.arch)"
          docker run --rm openstreamgrid-peer:test -e "require('@roamhq/wrtc'); console.log('@roamhq/wrtc', process.arch)"
      - name: Lint Helm chart
        if: matrix.runner == 'ubuntu-latest'
        run: docker run --rm -v "$PWD:/src" alpine/helm:3.16.4 lint /src/helm/openstreamgrid
