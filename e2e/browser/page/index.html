<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenStreamGrid browser E2E viewer</title>
    <script type="importmap">
      { "imports": { "hls.js": "/vendor/hls.mjs" } }
    </script>
  </head>
  <body>
    <video id="video" muted autoplay playsinline></video>
    <script type="module">
      import Hls from "hls.js";
      import { OpenStreamGridHlsPlugin, OpenStreamGridShakaPlugin } from "/sdk/sdk.js";

      const params = new URLSearchParams(location.search);
      const state = {
        peerId: params.get("peer"),
        peerFetched: 0,
        peerFetchedSegments: [],
        originFallbacks: 0,
        fatalErrors: [],
        events: {},
        recent: [],
      };
      window.osg = state;

      const options = {
        trackerUrl: params.get("tracker"),
        broadcastId: params.get("broadcast") ?? "live",
        peerId: params.get("peer"),
        originBaseUrl: params.get("originBase"),
        // Host candidates only: both viewers run on the same machine.
        iceServers: [],
        // The test stream is ~3 Mbps; the 1 Mbps default upload cap could
        // never deliver a segment before its playback deadline on this LAN.
        maxUploadBitrate: 50_000_000,
        onEvent: (event) => {
          state.events[event.type] = (state.events[event.type] ?? 0) + 1;
          if (event.type === "peer_fetched") {
            state.peerFetched += 1;
            state.peerFetchedSegments = [...state.peerFetchedSegments.slice(-9), event.segment];
          }
          if (event.type === "origin_fallback") state.originFallbacks += 1;
          // Keep the latest diagnostic events for failure reports.
          state.recent = [...state.recent.slice(-49), { t: Math.round(performance.now()), ...event }];
        },
      };
      const video = document.getElementById("video");

      if (params.get("player") === "shaka") {
        await new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = "/vendor/shaka-player.compiled.js";
          script.onload = resolve;
          script.onerror = reject;
          document.head.append(script);
        });
        const { shaka } = window;
        shaka.polyfill.installAll();
        new OpenStreamGridShakaPlugin(options).attach(shaka);
        const player = new shaka.Player();
        player.addEventListener("error", (event) => {
          if (event.detail?.severity === shaka.util.Error.Severity.CRITICAL) {
            state.fatalErrors.push(`shaka-${event.detail.code}`);
          }
        });
        try {
          await player.attach(video);
          await player.load(params.get("playlist"));
        } catch (error) {
          state.fatalErrors.push(`shaka-load-${error?.code ?? error}`);
        }
      } else if (params.get("player") === "videojs") {
        // Video.js 10 builds hls.js itself, so the grid's loader goes in
        // through source.engine.hlsJs; attaching the engine it creates enables
        // playback-deadline scheduling.
        const { Hls } = await import("/vendor/videojs.mjs");
        const plugin = new OpenStreamGridHlsPlugin(options);
        const element = document.createElement("hlsjs-video");
        element.muted = true;
        element.autoplay = true;
        element.playsInline = true;
        element.source = {
          src: params.get("playlist"),
          // Chromium can play HLS natively, which would bypass hls.js.
          preferPlayback: "mse",
          engine: {
            hlsJs: { liveSyncDurationCount: 3, ...plugin.hlsJsConfig(Hls.DefaultConfig.loader) },
          },
        };
        video.replaceWith(element);
        window.osgMediaElement = () => element.engine?.media ?? null;
        let attachedEngine = null;
        setInterval(() => {
          const engine = element.engine;
          if (!engine || engine === attachedEngine) return;
          attachedEngine = engine;
          plugin.attach(engine);
          engine.on(Hls.Events.ERROR, (_event, data) => {
            if (data.fatal) state.fatalErrors.push(data.details);
          });
        }, 100);
        element.play?.()?.catch?.(() => undefined);
      } else {
        const plugin = new OpenStreamGridHlsPlugin(options);
        const hls = new Hls({ liveSyncDurationCount: 3 });
        hls.on(Hls.Events.ERROR, (_event, data) => {
          if (data.fatal) state.fatalErrors.push(data.details);
        });
        plugin.attach(hls);
        hls.loadSource(params.get("playlist"));
        hls.attachMedia(video);
      }
    </script>
  </body>
</html>
