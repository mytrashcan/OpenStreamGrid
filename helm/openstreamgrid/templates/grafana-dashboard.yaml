{{- if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-dashboard" (include "openstreamgrid.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "openstreamgrid.labels" . | nindent 4 }}
    {{- with .Values.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.grafanaDashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  openstreamgrid.json: |-
{{ .Files.Get "dashboards/openstreamgrid.json" | indent 4 }}
{{- end }}
