tracker:
  image:
    repository: ghcr.io/mytrashcan/openstreamgrid-tracker
    # Defaults to v<appVersion>, matching the published GHCR release tag.
    tag: ""
    pullPolicy: IfNotPresent
  # SQLite uses a single writer. Scale only after selecting a shared external store.
  replicaCount: 1
  # Optional PriorityClass so the single tracker replica is rescheduled ahead of
  # less important workloads after a node failure.
  priorityClassName: ""
  # Reverse proxies in front of the tracker (ingress controller, TLS proxy, CDN)
  # whose X-Forwarded-For is trusted for per-client limits. Unset means 1 when
  # the chart's ingress is enabled and 0 otherwise; set a number to override.
  trustProxyHops: null
  port: 7070
  env:
    STORE_TYPE: sqlite
    DB_PATH: /data/tracker.db
  # Additional Kubernetes EnvVar entries, for example TRACKER_WS_ALLOWED_ORIGINS,
  # RATE_LIMIT_RPS, or MAX_PEERS_PER_BROADCAST. valueFrom is supported.
  extraEnv: []
  auth:
    # Create this Secret before installation; see deploy/k8s/README.md.
    existingSecret: openstreamgrid-auth
    apiKeyKey: tracker-api-key
    peerSessionSecretKey: peer-session-secret
  # Sized for the default MAX_PEERS_PER_BROADCAST=500. Tracker memory is about
  # 105 MB plus 40 KB per active peer (see docs/tracker-capacity.md); raise the
  # memory limit before raising the peer cap, for example 512Mi for 4000 peers.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    storageClassName: ""
  autoscaling:
    enabled: false
    maxReplicas: 6
    targetCPUUtilizationPercentage: 60
  metrics:
    serviceMonitor:
      # Requires the Prometheus Operator CRDs. When auth.existingSecret is set,
      # the tracker API key is sent to /metrics as a Bearer token.
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      # Extra labels, for example to match a Prometheus serviceMonitorSelector.
      labels: {}
    prometheusRule:
      # Alerts on the tracker's metrics; requires the Prometheus Operator CRDs
      # and the ServiceMonitor above (the rules select its scrape target).
      enabled: false
      # How long a condition must hold before its alert fires.
      for: 10m
      # Credential refusals per second (HTTP 401/403 and WebSocket upgrades
      # with a bad session) that count as an attack or a misconfigured client.
      authFailuresPerSecond: 1
      # Event-loop delay p99 above which signaling is too slow for viewers.
      eventLoopDelaySeconds: 0.2
      # Extra labels, for example to match a Prometheus ruleSelector.
      labels: {}

origin:
  image:
    repository: ghcr.io/mytrashcan/openstreamgrid-origin
    # Defaults to v<appVersion>, matching the published GHCR release tag.
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 8080
  env:
    HLS_DIRECTORY: /data/hls
    BROADCAST_ID: live
    # Leave empty to advertise the in-cluster Origin service. Set the external
    # HTTPS URL when browser clients access HLS through an ingress or CDN.
    PUBLIC_ORIGIN_URL: ""
  # Additional Kubernetes EnvVar entries, for example SEGMENT_DURATION_SECONDS.
  extraEnv: []
  hlsSizeLimit: 256Mi
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: stream.example.com
  tls: []

networkPolicy:
  enabled: true
  # NetworkPolicyPeer entries allowed to reach the tracker in addition to the
  # origin, for example the ingress controller's namespace. Empty allows any
  # source. Restrict it when trusting X-Forwarded-For so in-cluster clients
  # cannot bypass the ingress and choose their own address.
  trackerIngressFrom: []

grafanaDashboard:
  # Ships dashboards/openstreamgrid.json in a ConfigMap for the Grafana
  # dashboard sidecar (for example the one in kube-prometheus-stack).
  enabled: false
  labels:
    grafana_dashboard: "1"
  annotations: {}

nameOverride: ""
fullnameOverride: ""
